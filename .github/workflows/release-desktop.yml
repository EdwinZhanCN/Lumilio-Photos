name: Release Desktop

# Builds the desktop distributions on version tags and attaches them to the
# GitHub Release:
#   - macOS (Apple Silicon): ad-hoc-signed DMG via task desktop:build:macos:dmg
#   - Windows (amd64): portable zip + Inno Setup installer via
#     task desktop:build:windows and desktop/packaging/windows/lumilio.iss
# One shared web SPA + control-panel bundle feeds both platform jobs.
# SQLite, FTS5, and SQLite Vec1 are linked into the desktop executable.
#
# macOS amd64 is deferred until fetch-resources gains Intel ffmpeg pins
# (then: add a matrix entry using runner macos-15-intel).
#
# Responsibility split (see third_party/MIGRATION.md): Actions owns runners,
# OS packages, toolchain installs, caches, artifacts and credentials; every
# build step is a Task command from the repo Taskfile.

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    spa:
        name: web SPA + panel + licenses
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            packages: read
        steps:
            - uses: actions/checkout@v7

            - name: Install Task
              uses: go-task/setup-task@v2
              with:
                  version: 3.52.0

            - name: Enable pnpm via corepack
              run: corepack enable

            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: web/pnpm-lock.yaml

            - uses: actions/setup-go@v6
              with:
                  go-version-file: desktop/go.mod
                  cache-dependency-path: |
                      desktop/go.sum
                      server/go.sum

            - name: Install Vite+
              run: |
                  curl -fsSL https://vite.plus | bash
                  echo "$HOME/.vite-plus/bin" >> "$GITHUB_PATH"

            # @edwinzhancn/docts resolves from GitHub Packages (token required).
            - name: Authenticate GitHub Packages
              run: echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> ~/.npmrc
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # The notices generator runs `go list` over the desktop module,
            # whose //go:embed frontend needs frontend/dist to exist — so the
            # control panel bundle must be built before the licenses task.
            - name: Build control panel frontend
              run: task ci:desktop:panel

            - name: Build web SPA
              run: |
                  task web:install:ci
                  task web:build

            - name: Generate third-party notices
              run: task desktop:licenses

            - uses: actions/upload-artifact@v7
              with:
                  name: web-dist
                  path: web/dist
                  if-no-files-found: error
                  retention-days: 1

            - uses: actions/upload-artifact@v7
              with:
                  name: panel-dist
                  path: desktop/frontend/dist
                  if-no-files-found: error
                  retention-days: 1

            - uses: actions/upload-artifact@v7
              with:
                  name: third-party-notices
                  path: desktop/licenses/THIRD_PARTY_NOTICES.txt
                  if-no-files-found: error
                  retention-days: 1

    dmg:
        name: dmg (${{ matrix.arch }})
        needs: spa
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: arm64
                      runner: macos-15
        steps:
            - uses: actions/checkout@v7

            - name: Install Task
              uses: go-task/setup-task@v2
              with:
                  version: 3.52.0

            - name: Install build dependencies
              run: brew install vips libraw dylibbundler create-dmg

            # cgo bakes versioned Homebrew Cellar paths
            # (-L/opt/homebrew/Cellar/vips/<ver>/lib) into cached Go build
            # artifacts. With a cache keyed only on go.sum, a runner-image brew
            # bump restores objects that link against Cellar paths that no
            # longer exist ("ld: library 'vips' not found"), so the native
            # dependency versions must participate in the cache key.
            - name: Record native dep versions for the Go cache key
              run: |
                  brew list --versions vips libraw $(brew deps vips libraw) \
                      | sort > .brew-go-cache-key
                  cat .brew-go-cache-key

            - uses: actions/setup-go@v6
              with:
                  go-version-file: desktop/go.mod
                  cache-dependency-path: |
                      desktop/go.sum
                      server/go.sum
                      .brew-go-cache-key

            # The custom macOS devtool build depends on the Wails icon
            # generator; pin the CLI to the version selected by desktop/go.mod.
            - name: Install wails3 CLI
              run: |
                  cd desktop
                  W3_VERSION=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
                  go install "github.com/wailsapp/wails/v3/cmd/wails3@${W3_VERSION}"
                  echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

            - name: Stage web SPA
              uses: actions/download-artifact@v8
              with:
                  name: web-dist
                  path: web/dist

            - name: Stage control panel bundle
              uses: actions/download-artifact@v8
              with:
                  name: panel-dist
                  path: desktop/frontend/dist

            - name: Stage third-party notices
              uses: actions/download-artifact@v8
              with:
                  name: third-party-notices
                  path: desktop/licenses

            - name: Stage media tools (ffmpeg/ffprobe/exiftool)
              run: task desktop:resources

            # github.ref_name is a tag on releases but a branch on manual
            # dispatch, and branch names may contain '/' — which turns the
            # artifact filename into a nonexistent directory. Sanitize once.
            - name: Compute artifact-safe ref name
              run: echo "SAFE_REF=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

            - name: Build .app and DMG
              run: |
                  LUMILIO_VERSION="${SAFE_REF#v}" \
                  LUMILIO_WEB_DIST_PREBUILT=1 LUMILIO_FRONTEND_DIST_PREBUILT=1 \
                      task desktop:build:macos:dmg ARCH=${{ matrix.arch }}

            - name: Rename DMG for release
              run: |
                  mv "desktop/bin/Lumilio-Photos-${{ matrix.arch }}.dmg" \
                     "desktop/bin/Lumilio-Photos-${SAFE_REF}-macos-${{ matrix.arch }}.dmg"

            - uses: actions/upload-artifact@v7
              with:
                  name: dmg-${{ matrix.arch }}
                  path: desktop/bin/Lumilio-Photos-*-macos-${{ matrix.arch }}.dmg
                  if-no-files-found: error

    windows:
        name: windows (amd64)
        needs: spa
        runs-on: windows-2025
        steps:
            - uses: actions/checkout@v7

            - name: Install Task
              uses: go-task/setup-task@v2
              with:
                  version: 3.52.0

            - uses: msys2/setup-msys2@v2
              with:
                  msystem: MINGW64
                  update: false
                  # inherit keeps the Windows PATH (task, node, pnpm) visible
                  # inside the MSYS2 shell used for the build steps.
                  path-type: inherit
                  install: >-
                      git
                      zip
                      mingw-w64-x86_64-go
                      mingw-w64-x86_64-gcc
                      mingw-w64-x86_64-pkgconf
                      mingw-w64-x86_64-sqlite3
                      mingw-w64-x86_64-libvips
                      mingw-w64-x86_64-libraw
                      mingw-w64-x86_64-ntldd

            - name: Stage web SPA
              uses: actions/download-artifact@v8
              with:
                  name: web-dist
                  path: web/dist

            - name: Stage control panel bundle
              uses: actions/download-artifact@v8
              with:
                  name: panel-dist
                  path: desktop/frontend/dist

            - name: Stage third-party notices
              uses: actions/download-artifact@v8
              with:
                  name: third-party-notices
                  path: desktop/licenses

            # Branch names from manual dispatch may contain '/', which would
            # turn artifact filenames into nonexistent directories (see the
            # matching step in the dmg job).
            - name: Compute artifact-safe ref name
              shell: bash
              run: echo "SAFE_REF=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

            - name: Stage media tools (ffmpeg/ffprobe/exiftool)
              shell: msys2 {0}
              run: task desktop:resources

            # The wails3 CLI generates the .syso icon/version resources that
            # devtool links into the exe; pin it to the version in go.mod.
            - name: Install wails3 CLI
              shell: msys2 {0}
              run: |
                  cd desktop
                  W3_VERSION=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
                  go install "github.com/wailsapp/wails/v3/cmd/wails3@${W3_VERSION}"
                  echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

            - name: Build portable app directory
              shell: msys2 {0}
              env:
                  LUMILIO_TAG: ${{ env.SAFE_REF }}
              run: |
                  LUMILIO_VERSION="${LUMILIO_TAG#v}" \
                  LUMILIO_WEB_DIST_PREBUILT=1 LUMILIO_FRONTEND_DIST_PREBUILT=1 \
                      task desktop:build:windows

            - name: Zip portable app
              shell: pwsh
              run: |
                  Compress-Archive -Path "desktop/bin/windows/Lumilio Photos" `
                      -DestinationPath "desktop/bin/Lumilio-Photos-${{ env.SAFE_REF }}-windows-amd64.zip"

            - name: Build installer (Inno Setup)
              shell: pwsh
              env:
                  LUMILIO_TAG: ${{ env.SAFE_REF }}
              run: |
                  $ver = "${env:LUMILIO_TAG}".TrimStart('v')
                  choco install innosetup --no-progress -y
                  $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
                  & "$iscc" "/DAppVersion=$ver" "desktop/packaging/windows/lumilio.iss"
                  if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }

            # Two separate artifacts so neither download wraps the other: the
            # installer and the portable zip are parallel, independent downloads.
            - uses: actions/upload-artifact@v7
              with:
                  name: windows-amd64-setup
                  path: desktop/bin/Lumilio-Photos-*-windows-amd64-setup.exe
                  if-no-files-found: error

            - uses: actions/upload-artifact@v7
              with:
                  name: windows-amd64
                  path: desktop/bin/Lumilio-Photos-*-windows-amd64.zip
                  if-no-files-found: error

    release:
        name: Attach to GitHub Release
        runs-on: ubuntu-24.04
        needs: [dmg, windows]
        if: startsWith(github.ref, 'refs/tags/')
        permissions:
            contents: write
        steps:
            - name: Download desktop artifacts
              uses: actions/download-artifact@v8
              with:
                  pattern: "{dmg-*,windows-amd64,windows-amd64-setup}"
                  path: dist
                  merge-multiple: true

            - uses: softprops/action-gh-release@v3
              with:
                  prerelease: ${{ contains(github.ref_name, '-') }}
                  fail_on_unmatched_files: true
                  files: |
                      dist/Lumilio-Photos-*.dmg
                      dist/Lumilio-Photos-*-windows-amd64-setup.exe
                      dist/Lumilio-Photos-*.zip
                  body: |
                      ## macOS Desktop (Apple Silicon)

                      1. Download `Lumilio-Photos-${{ github.ref_name }}-macos-arm64.dmg` and drag the app into **Applications**.
                      2. First launch: the app is ad-hoc signed (not notarized), so approve it once via **System Settings → Privacy & Security → Open Anyway**.
                      3. Allow the **local network** prompt so Lumen Intelligence servers can be discovered over mDNS (optional — the app works without ML).

                      ## Windows Desktop (x64)

                      **Installer (recommended):** download `Lumilio-Photos-${{ github.ref_name }}-windows-amd64-setup.exe` and run it.
                      It installs per-user (no admin), ensures the Edge WebView2 Runtime, and adds Start Menu + uninstaller entries.
                      SmartScreen may warn on the unsigned installer — choose **More info → Run anyway**.

                      **Portable (zip):** download `Lumilio-Photos-${{ github.ref_name }}-windows-amd64.zip`, extract anywhere, and run `Lumilio Photos\lumilio-photos.exe`.
                      Requires the Edge WebView2 Runtime to be present for the first-run setup window.

                      On first launch, allow the Windows Firewall prompt if you want LAN Lumen Intelligence discovery (optional).

                      Linux/Docker image: `ghcr.io/edwinzhancn/lumilio-server` — see `deploy/compose/caddy.compose.yml`.
