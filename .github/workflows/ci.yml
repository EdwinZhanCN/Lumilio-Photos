name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# Ownership boundary: this workflow owns triggers, path filters, runner OS,
# native packages, credentials, caches, Buildx, and artifacts. Repository
# commands and their sequencing live in the Taskfiles (task ci:* / web:* /
# desktop:* contracts); see third_party/MIGRATION.md.
jobs:
    # Detect which subtrees changed so each gate only runs when relevant.
    changes:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        outputs:
            server: ${{ steps.filter.outputs.server }}
            web: ${{ steps.filter.outputs.web }}
            web_job: ${{ steps.filter.outputs.web == 'true' || steps.filter.outputs.browser_smoke == 'true' || steps.filter.outputs.auth_e2e == 'true' || steps.filter.outputs.video_e2e == 'true' || steps.filter.outputs.recovery_e2e == 'true' }}
            e2e: ${{ steps.filter.outputs.browser_smoke == 'true' || steps.filter.outputs.auth_e2e == 'true' || steps.filter.outputs.video_e2e == 'true' || steps.filter.outputs.recovery_e2e == 'true' }}
            browser_smoke: ${{ steps.filter.outputs.browser_smoke }}
            auth_e2e: ${{ steps.filter.outputs.auth_e2e }}
            video_e2e: ${{ steps.filter.outputs.video_e2e }}
            recovery_e2e: ${{ steps.filter.outputs.recovery_e2e }}
            desktop: ${{ steps.filter.outputs.desktop }}
            site: ${{ steps.filter.outputs.site }}
        steps:
            - uses: actions/checkout@v7
            - uses: dorny/paths-filter@v4
              id: filter
              with:
                  filters: |
                      server:
                          - 'server/**'
                          - 'taskfile.yml'
                          - '.github/workflows/ci.yml'
                      web:
                          - 'web/**'
                          - 'taskfile.yml'
                          - '.github/workflows/ci.yml'
                      # Keep the required browser gate compact. This filter
                      # follows only the low-cost first-party journeys; heavier
                      # auth, video, and recovery suites have narrower filters
                      # below and share the same one-time E2E environment.
                      browser_smoke:
                          - '.github/workflows/ci.yml'
                          - 'taskfile.yml'
                          - 'web/taskfile.yml'
                          - 'web/e2e/compose*.yml'
                          - 'server/Dockerfile'
                          - 'server/go.mod'
                          - 'server/go.sum'
                          - 'server/migrations/**'
                          - 'server/internal/api/handler/album_handler.go'
                          - 'server/internal/api/handler/asset_handler*.go'
                          - 'server/internal/api/handler/repository_scan_handler*.go'
                          - 'server/internal/processors/asset_*.go'
                          - 'server/internal/processors/discover_task*.go'
                          - 'server/internal/processors/ingest_task*.go'
                          - 'server/internal/processors/metadata_task*.go'
                          - 'server/internal/processors/photo_helpers*.go'
                          - 'server/internal/processors/thumbnail_task*.go'
                          - 'server/internal/processors/transcode_task*.go'
                          - 'server/internal/queue/ingest_*.go'
                          - 'server/internal/queue/media_*.go'
                          - 'server/internal/queue/retry_asset_worker.go'
                          - 'server/internal/queue/queue_setup*.go'
                          - 'server/internal/queue/jobs/**'
                          - 'server/internal/service/album_service*.go'
                          - 'server/internal/service/asset_service*.go'
                          - 'server/internal/sourcing/**'
                          - 'server/internal/storage/**'
                          - 'web/playwright.config.ts'
                          - 'web/package.json'
                          - 'web/pnpm-lock.yaml'
                          - 'web/e2e/fixtures/**'
                          - 'web/e2e/pages/**'
                          - 'web/e2e/support/**'
                          - 'web/e2e/specs/capabilities.spec.ts'
                          - 'web/e2e/specs/login.spec.ts'
                          - 'web/e2e/specs/scan.spec.ts'
                          - 'web/e2e/specs/upload.spec.ts'
                          - 'web/src/app/**'
                          - 'web/src/contexts/WorkerProvider.tsx'
                          - 'web/src/features/assets/**'
                          - 'web/src/features/collections/**'
                          - 'web/src/features/manage/**'
                          - 'web/src/features/repositories/**'
                          - 'web/src/features/upload/**'
                          - 'web/src/lib/assets/**'
                          - 'web/src/lib/http-commons/**'
                      auth_e2e:
                          - '.github/workflows/ci.yml'
                          - 'taskfile.yml'
                          - 'web/taskfile.yml'
                          - 'web/e2e/compose*.yml'
                          - 'server/config/**'
                          - 'server/internal/api/handler/auth*.go'
                          - 'server/internal/api/ratelimit/**'
                          - 'server/internal/api/security_test.go'
                          - 'server/internal/service/auth*.go'
                          - 'server/internal/service/totp.go'
                          - 'server/internal/service/webauthn*.go'
                          - 'web/e2e/specs/auth-session.spec.ts'
                          - 'web/src/features/auth/**'
                          - 'web/src/lib/http-commons/auth.ts'
                          - 'web/src/lib/http-commons/client.ts'
                      video_e2e:
                          - '.github/workflows/ci.yml'
                          - 'taskfile.yml'
                          - 'web/taskfile.yml'
                          - 'web/e2e/compose*.yml'
                          - 'server/internal/processors/video*.go'
                          - 'server/internal/processors/*transcode*.go'
                          - 'server/internal/search/**'
                          - 'server/internal/service/indexing_service.go'
                          - 'server/internal/queue/ml_config_provider.go'
                          - 'server/internal/queue/jobs/types.go'
                          - 'web/e2e/specs/video-semantic*.spec.ts'
                          - 'web/e2e/support/fakelumen.Dockerfile'
                          - 'web/src/features/assets/flows/viewer/media/**'
                          - 'web/src/features/assets/model/browseItems.ts'
                          - 'web/src/features/monitor/api/useAssetIndexing.ts'
                          - 'web/src/features/settings/flows/ai/**'
                      recovery_e2e:
                          - '.github/workflows/ci.yml'
                          - 'taskfile.yml'
                          - 'web/taskfile.yml'
                          - 'web/e2e/compose*.yml'
                          - 'server/Dockerfile'
                          - 'server/internal/db/backup/**'
                          - 'server/internal/queue/db_backup_worker.go'
                          - 'server/internal/service/backup_service.go'
                          - 'server/internal/api/handler/backup_handler.go'
                          - 'server/internal/api/dto/backup_dto.go'
                          - 'web/e2e/specs/backup-recovery.spec.ts'
                          - 'web/src/features/settings/api/useBackups.ts'
                          - 'web/src/features/settings/flows/server/BackupSection.tsx'
                      desktop:
                          - 'desktop/**'
                          - 'server/**'
                          - 'taskfile.yml'
                          - '.github/workflows/ci.yml'
                      site:
                          - 'site/**'
                          - 'taskfile.yml'
                          - '.github/workflows/ci.yml'

    sqlite-architecture:
        name: SQLite-only architecture
        needs: changes
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Install Task
              uses: go-task/setup-task@v2
              with:
                  version: 3.52.0

            - uses: actions/setup-go@v6
              with:
                  go-version-file: server/go.mod
                  cache-dependency-path: |
                      server/go.sum
                      desktop/go.sum

            - name: Install CGo package metadata
              run: |
                  sudo apt-get update
                  # libheif plugins give vips AVIF/HEIC encode-decode (hard requirement
                  # for export?format=avif) — noble splits them into plugin packages.
                  sudo apt-get install -y --no-install-recommends libvips-dev libraw-dev libheif-plugin-aomenc libheif-plugin-libde265

            - name: Run architecture and Compose gates
              run: task ci:architecture

    # Linux is the standalone Server deployment target. macOS and Windows run
    # the same complete Server suite below as part of their Desktop App gates,
    # because the App hosts server/app in-process rather than a smaller runtime.
    server-linux:
        name: server linux (Task)
        needs: changes
        if: needs.changes.outputs.server == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Install Task
              uses: go-task/setup-task@v2
              with:
                  version: 3.52.0

            - uses: actions/setup-go@v6
              with:
                  go-version-file: server/go.mod
                  cache-dependency-path: server/go.sum

            # CGO headers for govips, libraw, and the vendored Vec1 source; the
            # libheif plugins cover AVIF/HEIC export (libvips loads them lazily).
            - name: Install libvips, libraw, and SQLite headers
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends libvips-dev libraw-dev libsqlite3-dev libheif-plugin-aomenc libheif-plugin-libde265

            - name: Run Server CI gate
              run: task ci:server

    web:
        name: web (Task)
        needs: changes
        if: needs.changes.outputs.web_job == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: read
        steps:
            - uses: actions/checkout@v7

            - name: Install Task
              uses: go-task/setup-task@v2
              with:
                  version: 3.52.0

            - uses: voidzero-dev/setup-vp@v1
              with:
                  node-version: '24'
                  cache: true

            # @edwinzhancn/docts lives on GitHub Packages, which requires a
            # token even for public packages (web/.npmrc maps the scope).
            - name: Authenticate GitHub Packages
              run: echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> ~/.npmrc
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Install dependencies
              run: task ci:web:install

            # Keyed on the lockfile, which changes when the Playwright version
            # does. A hit still needs `install-deps` for the apt libraries the
            # browser links against; the commands themselves live in the Web
            # Taskfile (playwright:install / playwright:install:deps).
            - name: Cache Playwright browsers
              id: playwright-cache
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}

            - name: Install Playwright Chromium
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: task ci:web:playwright:install

            - name: Install Playwright browser system dependencies
              if: steps.playwright-cache.outputs.cache-hit == 'true'
              run: task ci:web:playwright:install:deps

            - name: Run Web checks and unit tests
              if: needs.changes.outputs.web == 'true'
              run: task ci:web:test

            # A docker-container builder plus the ACTIONS_* runtime env let the
            # E2E image builds read and write the GitHub Actions layer cache;
            # web/e2e/compose.ci.yml wires the cache in per service.
            - uses: docker/setup-buildx-action@v3
              if: needs.changes.outputs.e2e == 'true'
            - uses: crazy-max/ghaction-github-runtime@v3
              if: needs.changes.outputs.e2e == 'true'

            - name: Start isolated E2E environment
              if: needs.changes.outputs.e2e == 'true'
              run: task ci:web:e2e:up
              env:
                  LUMILIO_E2E_COMPOSE_EXTRA: web/e2e/compose.ci.yml

            - name: Run Chromium smoke
              if: needs.changes.outputs.browser_smoke == 'true'
              run: task ci:web:e2e:browser

            - name: Run authentication hardening regression
              if: needs.changes.outputs.auth_e2e == 'true'
              run: task ci:web:e2e:auth-hardening

            - name: Run video semantic regression
              if: needs.changes.outputs.video_e2e == 'true'
              run: task ci:web:e2e:video-semantic

            - name: Run database backup and recovery regression
              if: needs.changes.outputs.recovery_e2e == 'true'
              run: task ci:web:e2e:backup-recovery

            - name: Capture E2E service logs
              if: ${{ failure() && needs.changes.outputs.e2e == 'true' }}
              run: |
                  mkdir -p web/test-results
                  cd web
                  vp run e2e:logs > test-results/services.log

            - name: Upload Playwright diagnostics
              if: ${{ failure() && needs.changes.outputs.e2e == 'true' }}
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-smoke-${{ github.run_id }}
                  path: |
                      web/playwright-report/
                      web/test-results/
                  if-no-files-found: ignore
                  retention-days: 7

            - name: Stop isolated E2E environment
              if: ${{ always() && needs.changes.outputs.e2e == 'true' }}
              run: task ci:web:e2e:down

    # macOS and Windows intentionally validate the same product surface:
    # complete embedded Server tests, complete Desktop tests, and a native CGo
    # build. Only dependency/toolchain setup and platform-specific test files
    # differ between the two jobs.
    desktop-macos:
        name: desktop macos (tests + CGo build)
        needs: changes
        if: needs.changes.outputs.desktop == 'true'
        runs-on: macos-15
        steps:
            - uses: actions/checkout@v7

            - name: Install Task
              uses: go-task/setup-task@v2
              with:
                  version: 3.52.0

            - uses: actions/setup-go@v6
              with:
                  go-version-file: desktop/go.mod
                  cache-dependency-path: |
                      desktop/go.sum
                      server/go.sum

            # `task ci:desktop:panel` builds the React control panel first,
            # which needs `vp`. The panel's dependencies are all public, so it
            # needs no GitHub Packages token, and `frontend:install:ci` runs
            # `vp install` itself.
            - uses: voidzero-dev/setup-vp@v1
              with:
                  node-version: '24'
                  cache: true

            # CGO deps: both the complete Server suite and the Desktop module
            # compile govips/libraw. SQLite, FTS5, and Vec1 are linked into the
            # test binary, so no database service is staged.
            # ffmpeg/exiftool are required because Desktop hostProjection writes
            # absolute tools.* paths into the strict runtime manifest; CI has no
            # app bundle, so LookPath must resolve development installs.
            - name: Install libvips, libraw, and media tools
              run: brew install vips libraw ffmpeg exiftool

            - name: Build control panel
              run: task ci:desktop:panel

            - name: Run native Desktop CI gate
              run: task ci:desktop:native

    # Windows uses the same test/build scope as macOS, but runs Go inside the
    # MSYS2/mingw64 environment that supplies the release CGo toolchain. The
    # control panel stays in the default shell because vp is not on the MSYS2
    # PATH; the generated directory is shared on disk with the later steps.
    #
    # This job depends on an external toolchain (msys2 package availability), so
    # if it starts failing for reasons unrelated to a change, fix or pin the
    # toolchain — do not quietly restore continue-on-error.
    desktop-windows:
        name: desktop windows (tests + CGo build)
        needs: changes
        if: needs.changes.outputs.desktop == 'true'
        runs-on: windows-2025
        steps:
            - uses: actions/checkout@v7

            - name: Install Task
              uses: go-task/setup-task@v2
              with:
                  version: 3.52.0

            - uses: msys2/setup-msys2@v2
              with:
                  msystem: MINGW64
                  update: false
                  # Keep tools installed by Windows actions, especially Task,
                  # visible inside the MSYS2 shell used by the native gate.
                  path-type: inherit
                  install: >-
                      git
                      mingw-w64-x86_64-go
                      mingw-w64-x86_64-gcc
                      mingw-w64-x86_64-pkgconf
                      mingw-w64-x86_64-sqlite3
                      mingw-w64-x86_64-libvips
                      mingw-w64-x86_64-libraw
                      mingw-w64-x86_64-ffmpeg

            - uses: voidzero-dev/setup-vp@v1
              with:
                  node-version: '24'
                  cache: true

            - name: Build control panel
              run: task ci:desktop:panel

            # MSYS2 ships ffmpeg/ffprobe but not exiftool. Desktop hostProjection
            # only needs a resolvable absolute path for strict manifest load in
            # tests; create a no-op stub so LookPath succeeds. Keep the stub
            # under the workspace so MSYS2 PATH does not depend on Windows
            # RUNNER_TEMP orthography.
            - name: Provide exiftool stub for Desktop tests
              shell: msys2 {0}
              run: |
                  stub_dir="$(pwd)/.cache/lumilio-tool-stubs"
                  mkdir -p "${stub_dir}"
                  printf '%s\n' '#!/bin/sh' 'exit 0' > "${stub_dir}/exiftool"
                  printf '%s\n' '#!/bin/sh' 'exit 0' > "${stub_dir}/exiftool.exe"
                  chmod +x "${stub_dir}/exiftool" "${stub_dir}/exiftool.exe"
                  echo "LUMILIO_TOOL_STUBS=${stub_dir}" >> "${GITHUB_ENV}"
                  export PATH="${stub_dir}:${PATH}"
                  command -v ffmpeg
                  command -v ffprobe
                  command -v exiftool

            - name: Run native Desktop CI gate
              shell: msys2 {0}
              run: |
                  go version
                  pkgconf --modversion vips libraw
                  export PATH="${LUMILIO_TOOL_STUBS}:${PATH}"
                  task ci:desktop:native

    site:
        name: site (vitepress build)
        needs: changes
        if: needs.changes.outputs.site == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Install Task
              uses: go-task/setup-task@v2
              with:
                  version: 3.52.0

            # setup-vp provisions the runtime, the package manager pinned by
            # site/package.json, and install caching, so pnpm needs no separate
            # corepack or setup-node step.
            - uses: voidzero-dev/setup-vp@v1
              with:
                  node-version: '24'
                  cache: true

            - name: Install and build docs site
              run: task ci:site

    # This is the single stable branch-protection check. It always runs, even
    # when a path-filtered job is skipped, and verifies that every job which was
    # expected for this change actually succeeded.
    ci-required:
        name: CI required
        if: always()
        needs:
            - changes
            - sqlite-architecture
            - server-linux
            - web
            - desktop-macos
            - desktop-windows
            - site
        runs-on: ubuntu-latest
        steps:
            - name: Require all applicable CI jobs
              env:
                  CHANGES_RESULT: ${{ needs.changes.result }}
                  SQLITE_ARCHITECTURE_RESULT: ${{ needs.sqlite-architecture.result }}
                  SERVER_CHANGED: ${{ needs.changes.outputs.server }}
                  SERVER_RESULT: ${{ needs.server-linux.result }}
                  WEB_REQUIRED: ${{ needs.changes.outputs.web_job }}
                  WEB_RESULT: ${{ needs.web.result }}
                  DESKTOP_CHANGED: ${{ needs.changes.outputs.desktop }}
                  DESKTOP_MACOS_RESULT: ${{ needs.desktop-macos.result }}
                  DESKTOP_WINDOWS_RESULT: ${{ needs.desktop-windows.result }}
                  SITE_CHANGED: ${{ needs.changes.outputs.site }}
                  SITE_RESULT: ${{ needs.site.result }}
              run: |
                  set -eu

                  if [ "$CHANGES_RESULT" != "success" ]; then
                      echo "::error::changes job finished with $CHANGES_RESULT"
                      exit 1
                  fi

                  if [ "$SQLITE_ARCHITECTURE_RESULT" != "success" ]; then
                      echo "::error::sqlite architecture finished with $SQLITE_ARCHITECTURE_RESULT"
                      exit 1
                  fi

                  check_job() {
                      label="$1"
                      changed="$2"
                      result="$3"

                      if [ "$changed" = "true" ]; then
                          if [ "$result" != "success" ]; then
                              echo "::error::$label was required but finished with $result"
                              return 1
                          fi
                      elif [ "$result" != "skipped" ]; then
                          echo "::error::$label was not required but finished with $result"
                          return 1
                      fi
                  }

                  check_job "server linux" "$SERVER_CHANGED" "$SERVER_RESULT"
                  check_job "web" "$WEB_REQUIRED" "$WEB_RESULT"
                  check_job "desktop macos" "$DESKTOP_CHANGED" "$DESKTOP_MACOS_RESULT"
                  check_job "desktop windows" "$DESKTOP_CHANGED" "$DESKTOP_WINDOWS_RESULT"
                  check_job "site" "$SITE_CHANGED" "$SITE_RESULT"
