# Server (Go API + embedded SQLite) tasks. Runs in the server/ directory.
#
# DEV_CONFIG / GO_BUILD_TAGS are injected by the root Taskfile include; the
# `default` fallbacks at each use site keep standalone runs (`cd server && task
# test`) working without shadowing the injected values.
version: '3'

env:
  # cgo needs these for the libraw binding; see the root taskfile for details.
  # Declared here (not only at the root) so standalone runs behave identically.
  CGO_LDFLAGS_ALLOW: -Xpreprocessor
  CGO_CFLAGS_ALLOW: -Xpreprocessor

tasks:
  install:
    desc: Download Go module dependencies
    cmds:
      - go mod download

  test:
    desc: Run Go Server tests
    env:
      # Windows MSYS2 requires these (Go defaults CGO off and the mingw64 git
      # breaks VCS stamping); harmless on Linux/macOS. CI no longer declares
      # them, keeping platform test parameters in the Taskfile.
      CGO_ENABLED: '1'
      GOFLAGS: -buildvcs=false
    cmds:
      - go test -tags={{.GO_BUILD_TAGS | default "sqlite_fts5"}} ./...

  test:ci:
    desc: Run Go Server tests in CI mode with a clean cache
    env:
      CGO_ENABLED: '1'
      GOFLAGS: -buildvcs=false
    cmds:
      # Native runners can reuse cgo objects linked against stale package paths;
      # rebuild from clean build and test caches like the Desktop CI task.
      - go clean -cache -testcache
      - go test -tags={{.GO_BUILD_TAGS | default "sqlite_fts5"}} ./...

  test:volumes:
    desc: Volume-semantics evidence on mounted filesystem images (LUMILIO_VOLUME_FIXTURES="kind=path;...")
    env:
      CGO_ENABLED: '1'
      GOFLAGS: -buildvcs=false
    preconditions:
      # The workflow owns the images: it formats, mounts and names them. The
      # tests skip without the variable, so running this target without it
      # would prove nothing.
      - sh: test -n "$LUMILIO_VOLUME_FIXTURES"
        msg: 'LUMILIO_VOLUME_FIXTURES must name the mounted filesystem images as "kind=path;kind=path"'
    cmds:
      - >-
        go test
        -tags={{.GO_BUILD_TAGS | default "sqlite_fts5"}}
        -count=1
        -run '^TestVolume'
        ./internal/storage/pathsemantics
        ./app

  # The Linux Server gate on another machine: DOCKER_CONTEXT names the Docker
  # host (for example a Linux test box), and the image is built there from
  # this checkout. The container runs detached so a dropped connection does
  # not stop it; `docker logs lumilio-server-test` re-attaches. Privileged
  # with /dev for the loop-mounted volume images. LUMILIO_GATE_STEPS narrows
  # the steps (ci concurrency volumes).
  test:linux:
    desc: Run the Linux Server gate (CI, concurrency, volume semantics) in a container on the Docker host named by DOCKER_CONTEXT
    preconditions:
      - sh: test -n "$DOCKER_CONTEXT"
        msg: 'set DOCKER_CONTEXT to the Docker context of the Linux host that builds and runs the gate'
    cmds:
      - docker build -f test.Dockerfile -t lumilio-server-test ..
      - docker rm -f lumilio-server-test >/dev/null 2>&1 || true
      - >-
        docker run -d --name lumilio-server-test --privileged -v /dev:/dev
        -v lumilio-server-test-tmp:/scratch
        -e LUMILIO_GATE_STEPS="${LUMILIO_GATE_STEPS:-ci concurrency volumes}"
        lumilio-server-test >/dev/null
      - docker logs -f lumilio-server-test
      - exit "$(docker wait lumilio-server-test)"

  test:concurrency:ci:
    desc: Race, shuffle, and repeat concurrency-sensitive Server packages
    env:
      CGO_ENABLED: '1'
      GOFLAGS: -buildvcs=false
    cmds:
      - >-
        go test
        -tags={{.GO_BUILD_TAGS | default "sqlite_fts5"}}
        -race
        -shuffle=on
        -count=3
        ./internal/cloud
        ./internal/commit
        ./internal/servertransport
        ./internal/storage

  dev:
    desc: Start only the Go API against the development manifest
    deps:
      - ':dev:config'
    preconditions:
      - sh: 'test -n "{{.DEV_CONFIG}}"'
        msg: 'DEV_CONFIG is empty; run from the repository root (task dev / task dev:config)'
    cmds:
      - go run -tags={{.GO_BUILD_TAGS | default "sqlite_fts5"}} ./cmd --config '{{.DEV_CONFIG}}'

  config-init:
    desc: Generate the development manifest into .local/dev/config/server.toml
    internal: true
    preconditions:
      - sh: 'test -n "{{.DEV_CONFIG}}"'
        msg: 'DEV_CONFIG is empty; run from the repository root (task dev / task dev:config)'
    cmds:
      - go run -tags={{.GO_BUILD_TAGS | default "sqlite_fts5"}} ./cmd config init --profile dev-vite --state-dir ../state --storage-dir ../storage --output '{{.DEV_CONFIG}}' --force

  openapi:
    desc: Generate the OpenAPI spec (server/docs/swagger.yaml)
    cmds:
      - swag init --v3.1 -g cmd/main.go -o docs/
      - go run ./tools/openapinormalize

  config-examples:
    desc: Regenerate the config schema and example manifests from profiles.go
    cmds:
      - go run ./tools/configgen >/dev/null
      - go run ./tools/configgen

  sqlc:
    desc: Regenerate SQL code from the queries in internal/db/repo/queries
    cmds:
      - sqlc generate
