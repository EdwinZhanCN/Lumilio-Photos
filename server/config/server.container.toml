# Complete development-only container HTTP manifest used by
# docker-compose.dev.yml. Production operators must generate an ACME or
# external-proxy manifest with `server config init`.
schema_version = 3
environment = "production"

[database]
path = "/data/app-state/library.sqlite3"

[server]
listen = "0.0.0.0:6680"
primary_origin = "http://localhost:6680"
# The server image contains the SPA and serves it on the API origin.
# Add only separately hosted browser frontends that need cookie sessions.
cors_allowed_origins = []
web_root = "/app/web"

[server.tls]
mode = "off"
http_listen = ""
email = ""
storage_path = ""

[server.proxy]
mode = "disabled"
trusted_cidrs = []

[logging]
level = "info"
dir = "/data/app-state/logs"
console_format = "console"
file_format = "json"
repository_audit_verbose = false

[storage]
# Media and machine-bound state are separate mounts in Docker Compose.
path = "/data/storage"
cloud_state_path = "/data/app-state/cloud"
backups_path = "/data/app-state/backups"

[repository_scan]
enabled = true
interval_seconds = 300
settle_seconds = 5
max_concurrent_repos = 1
batch_size = 500

[geocoding]
provider = "disabled"
nominatim_endpoint = "https://nominatim.openstreetmap.org/reverse"
language = "en"
user_agent = "Lumilio-Photos/1.0"

[auth]
secret_key_file = "/data/app-state/secrets/lumilio_secret_key"
access_token_ttl = "15m"
refresh_token_ttl = "168h"
media_token_ttl = "10m"

[auth.passkey]
enabled = true
name = "Lumilio Photos"

[auth.rate_limit]
ip_attempts = 60
subject_attempts = 8
window = "1m"
lockout = "5m"
max_entries = 10000

[transcode]
hardware_accel = "none"

[lumen]
discovery_enabled = false
discovery_mdns_enabled = false
discovery_hub_url = ""
discovery_static_nodes = []
discovery_service_type = "_lumen._tcp"
discovery_domain = "local"
deployment_id = "container"
resolve_timeout = "3s"
connect_timeout = "3s"
rediscovery_backoff_min = "10s"
rediscovery_backoff_max = "2m"
scan_interval = "30s"
chunk_auto = true
chunk_threshold_bytes = 1048576
chunk_max_bytes = 262144

[tools]
exiftool_path = "exiftool"
ffmpeg_path = "ffmpeg"
ffprobe_path = "ffprobe"
