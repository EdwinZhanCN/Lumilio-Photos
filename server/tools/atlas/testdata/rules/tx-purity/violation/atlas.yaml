goModules:
  - { dir: fx, path: fx, side: server }
groups:
  - { id: all, title: All, side: server, summary: Every fixture package., match: ['fx/**'] }
sql:
  queries:
    - files: [fx/repo/queries/*.sql]
      type: "*fx/repo.Queries"
  executors: ["*database/sql.DB", "*database/sql.Tx"]
  triggers: [migrations/*.up.sql]
rules:
  - id: tx-purity
    why: no filesystem, sleeping, or table-wide COUNT inside a transaction
    tx_purity:
      tx_types: ["*database/sql.Tx", "*fx/catalogtx.Tx"]
      begin: ["(*fx/catalogtx.Writer).BeginTx"]
      forbid_packages: [os, io]
      forbid_calls: [time.Sleep]
      forbid_count_queries: true
      allow: [os.IsNotExist]
