goModules:
  - { dir: fx, path: fx, side: server }
groups:
  - { id: all, title: All, side: server, summary: Every fixture package., match: ['fx/**'] }
sql:
  executors: ["*database/sql.DB", "fx/catalog.Statements"]
rules:
  - id: catalog-sql-sites
    why: hand-written SQL only shrinks
    budgets: { measure: sql, default: 0, except: [fx/catalog/**] }
