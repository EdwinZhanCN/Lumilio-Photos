goModules:
  - { dir: fx, path: fx, side: server }
groups:
  - { id: all, title: All, side: server, summary: Every fixture package., match: ['fx/**'] }
rules:
  - id: catalog-handle-imports
    why: preparers and the scan index never hold the catalog database
    forbid_imports:
      from: [fx/sourcing/materializer.go, fx/scan]
      imports: [fx/db]
