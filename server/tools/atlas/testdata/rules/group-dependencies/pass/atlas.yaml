# high declares the import it makes.
goModules:
  - { dir: fx, path: fx, side: server }
groups:
  - { id: low, title: Low, side: server, summary: The lower layer., match: [fx/low] }
  - { id: high, title: High, side: server, summary: The upper layer., match: [fx/high], uses: [low] }
rules:
  - id: group-dependencies
    why: every import that crosses a group boundary is a reviewed architecture decision
    group_uses: true
