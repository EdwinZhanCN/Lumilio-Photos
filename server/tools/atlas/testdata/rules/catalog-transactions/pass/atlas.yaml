goModules:
  - { dir: fx, path: fx, side: server }
groups:
  - { id: all, title: All, side: server, summary: Every fixture package., match: ['fx/**'] }
rules:
  - id: catalog-transactions
    why: one writer; every catalog transaction is named, admitted, and measured
    calls:
      targets: ["(*database/sql.DB).BeginTx", "(*database/sql.DB).ExecContext"]
      only: [fx/catalogtx]
