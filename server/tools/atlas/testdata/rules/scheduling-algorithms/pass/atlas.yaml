goModules:
  - { dir: fx, path: fx, side: server }
groups:
  - { id: all, title: All, side: server, summary: Every fixture package., match: ['fx/**'] }
rules:
  - id: scheduling-algorithms
    why: the composition root only constructs and runs
    calls:
      targets: ["(*fx/processors.AssetProcessor).ComputeMetadataTask", fx/river.AddWorker]
      only: [fx/processors, fx/app/pipeline_runtime.go]
