goModules:
  - { dir: fx, path: fx, side: server }
groups:
  - { id: all, title: All, side: server, summary: Every fixture package., match: ['fx/**'] }
rules:
  - id: storage-reconciliation
    why: a foreground read never reconciles
    calls:
      targets: ["(*fx/storage.DefaultRepositoryManager).ReconcileAll"]
      only: [fx/storage]
