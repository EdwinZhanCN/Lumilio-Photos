# Recommended Linux host-network deployment. Caddy owns public TCP 80/443;
# Lumilio listens only on host loopback and trusts that peer for forwarded
# request metadata.
name: lumilio-photos-caddy

services:
    lumilio:
        image: ${LUMILIO_IMAGE:-ghcr.io/edwinzhancn/lumilio-server:latest}
        restart: unless-stopped
        network_mode: host
        command: ["server", "--config", "/app/config/docker-caddy.toml"]
        volumes:
            - ${LUMILIO_STORAGE:-./lumilio/media}:/data/storage
            - ${LUMILIO_STATE:-./lumilio/app-state}:/data/app-state
        healthcheck:
            test: ["CMD", "server", "config", "healthcheck", "--config", "/app/config/docker-caddy.toml"]
            interval: 10s
            timeout: 6s
            retries: 12
            start_period: 20s

    caddy:
        image: caddy:2.10.2-alpine
        restart: unless-stopped
        network_mode: host
        depends_on:
            lumilio:
                condition: service_healthy
        configs:
            - source: caddyfile
              target: /etc/caddy/Caddyfile
        volumes:
            - caddy_data:/data
            - caddy_config:/config

configs:
    caddyfile:
        content: |
            ${LUMILIO_DOMAIN:?set LUMILIO_DOMAIN to the public DNS hostname} {
                reverse_proxy 127.0.0.1:6680 {
                    header_up X-Forwarded-For {remote_host}
                }
            }

volumes:
    caddy_data:
    caddy_config:
