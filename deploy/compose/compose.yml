# Default Linux deployment. Host networking preserves Lumen mDNS discovery and
# makes Lumilio available at http://<host-ip>:6680 without a domain or proxy.
name: lumilio-photos

services:
    lumilio:
        image: ${LUMILIO_IMAGE:-ghcr.io/edwinzhancn/lumilio-server:latest}
        restart: unless-stopped
        network_mode: host
        volumes:
            - type: bind
              source: ${LUMILIO_STORAGE:-./lumilio/media}
              target: /data/storage
              bind:
                  create_host_path: false
            - type: bind
              source: ${LUMILIO_STATE:-./lumilio/app-state}
              target: /data/app-state
              bind:
                  create_host_path: false
