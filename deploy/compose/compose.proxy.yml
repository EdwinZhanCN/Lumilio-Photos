# Linux host-network deployment for an existing reverse proxy. The default
# docker-external-proxy manifest listens on 127.0.0.1:6680 for a same-host
# proxy. Generate it with --listen <host-address>:6680 for a remote proxy and
# firewall the listener to that proxy.
name: lumilio-photos-proxy

services:
    lumilio:
        image: ${LUMILIO_IMAGE:-ghcr.io/edwinzhancn/lumilio-server:latest}
        restart: unless-stopped
        network_mode: host
        command: ["server", "--config", "/data/app-state/server.toml"]
        volumes:
            - ${LUMILIO_STORAGE:?set LUMILIO_STORAGE to the media root}:/data/storage
            - ${LUMILIO_STATE:?set LUMILIO_STATE to the machine-local app-state root}:/data/app-state
        healthcheck:
            test: ["CMD", "server", "config", "healthcheck", "--config", "/data/app-state/server.toml"]
            interval: 10s
            timeout: 6s
            retries: 12
            start_period: 20s
