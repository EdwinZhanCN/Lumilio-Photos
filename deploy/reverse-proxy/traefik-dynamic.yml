# Replace the hostname before use. This example assumes Traefik and Lumilio run
# on the same Linux host and Lumilio uses the embedded docker-caddy manifest.
http:
    routers:
        lumilio:
            rule: Host(`photos.example.com`)
            entryPoints:
                - websecure
            service: lumilio
            middlewares:
                - lumilio-forwarded
            tls:
                certResolver: letsencrypt

    middlewares:
        lumilio-forwarded:
            headers:
                customRequestHeaders:
                    Forwarded: ""

    services:
        lumilio:
            loadBalancer:
                servers:
                    - url: http://127.0.0.1:6680
