# Static Traefik configuration for a native or host-network Traefik process.
# Mount traefik-dynamic.yml at the path below.
entryPoints:
    web:
        address: ":80"
    websecure:
        address: ":443"

providers:
    file:
        filename: /etc/traefik/traefik-dynamic.yml
        watch: true

certificatesResolvers:
    letsencrypt:
        acme:
            email: admin@example.com
            storage: /acme/acme.json
            httpChallenge:
                entryPoint: web
