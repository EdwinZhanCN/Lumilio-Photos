# Static Traefik example. Add the router labels shown in the deployment guide
# to the Lumilio service and keep both containers on the dedicated proxy
# network.
entryPoints:
    web:
        address: ":80"
    websecure:
        address: ":443"

providers:
    docker:
        exposedByDefault: false

certificatesResolvers:
    letsencrypt:
        acme:
            email: admin@example.com
            storage: /acme/acme.json
            httpChallenge:
                entryPoint: web
