# Lumilio Photos — SQLite-only production compose using the published image.
#
#   LUMILIO_STORAGE=/srv/photos \
#   LUMILIO_STATE=/srv/lumilio-state \
#   docker compose -f docker-compose.release.yml up -d
#
# Pin a version with LUMILIO_VERSION=v1.0.0 (default: latest). The complete
# schema-v2 manifest is baked into the image; immutable policy changes require
# mounting another complete manifest at /app/config/server.toml.

services:
    lumilio:
        image: ghcr.io/edwinzhancn/lumilio-server:${LUMILIO_VERSION:-latest}
        restart: unless-stopped
        volumes:
            - ${LUMILIO_STORAGE:?set LUMILIO_STORAGE to the media root}:/data/storage
            - ${LUMILIO_STATE:?set LUMILIO_STATE to the machine-local app-state root}:/data/app-state
        ports:
            - "${WEB_HTTP_PORT:-6657}:6680"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS http://localhost:6680/api/v1/health >/dev/null"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s
