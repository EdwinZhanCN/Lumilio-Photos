# Root orchestration layer (Taskfile v3).
#
# Ownership boundary:
#   - GitHub Actions: triggers, path filters, runner OS, native packages,
#     credentials, caches, Buildx, artifacts, branch-protection aggregation.
#   - This file + the included module Taskfiles: repository commands, working
#     directories, sequencing, platform-specific Go flags, and local/CI
#     command consistency.
#
# Module Taskfiles use the plain names (server/taskfile.yml, web/taskfile.yml,
# ...) so `task test` inside a module directory resolves to that module's
# Taskfile. Root aggregates are named with colons (dev:config, compose:test,
# ci:*) and are invoked from the repository root.
version: '3'

includes:
  server:
    taskfile: ./server/taskfile.yml
    dir: ./server
    aliases: [s]
    vars:
      REPO_ROOT: '{{.ROOT_DIR}}'
      DEV_CONFIG: '{{.DEV_CONFIG}}'
      GO_BUILD_TAGS: '{{.GO_BUILD_TAGS}}'
  web:
    taskfile: ./web/taskfile.yml
    dir: ./web
    aliases: [w]
    vars:
      API_URL: '{{.API_URL}}'
      WEB_DEV_PORT: '{{.WEB_DEV_PORT}}'
  desktop:
    taskfile: ./desktop/taskfile.yml
    dir: ./desktop
    aliases: [d]
    vars:
      GO_BUILD_TAGS: '{{.GO_BUILD_TAGS}}'
  site:
    taskfile: ./site/taskfile.yml
    dir: ./site

# prefixed output keeps parallel dependency output attributable; the strict
# shell options keep Task subprocesses aligned across local and CI runs.
output: prefixed
set: [errexit, nounset, pipefail]

vars:
  GO_BUILD_TAGS: '{{.GO_BUILD_TAGS | default "sqlite_fts5"}}'
  API_URL: '{{.API_URL | default "http://127.0.0.1:6680"}}'
  WEB_DEV_PORT: '{{.WEB_DEV_PORT | default "6657"}}'
  DEV_ROOT: '{{joinPath .ROOT_DIR ".local" "dev"}}'
  DEV_CONFIG: '{{joinPath .DEV_ROOT "config" "server.toml"}}'

# Keep these at the orchestration boundary so Server and Desktop commands get
# the same CGo allowlist locally and in CI.
env:
  CGO_LDFLAGS_ALLOW: -Xpreprocessor
  CGO_CFLAGS_ALLOW: -Xpreprocessor

tasks:
  default:
    desc: List available repository tasks
    silent: true
    cmds:
      - task --list

  setup:
    desc: Install repository dependencies and development tools
    cmds:
      - task: server:install
      - task: dev:config
      - task: web:install
      - task: site:install
      - task: tools:install
      - task: hooks:install

  dev:
    desc: Start Server and Web development processes
    cmds:
      - task: dev:config
      - task: dev:services

  dev:services:
    internal: true
    deps:
      - server:dev
      - web:dev

  test:
    desc: Run repository architecture, Server, and Web tests
    cmds:
      - task: architecture:check
      - task: test:modules

  test:modules:
    internal: true
    deps:
      - server:test
      - web:test

  dto:
    desc: Generate OpenAPI, TypeScript types, and API documentation
    cmds:
      - task: server:openapi
      - task: web:openapi-types
      - task: site:openapi-docs

  architecture:check:
    desc: Check repository architecture constraints
    cmds:
      - go -C server run ./tools/architecturecheck

  compose:test:
    desc: Validate every Docker Compose configuration
    cmds:
      - docker compose -f deploy/compose/compose.yml config --quiet
      - >-
        LUMILIO_STORAGE=/srv/lumilio/media
        LUMILIO_STATE=/srv/lumilio/state
        LUMILIO_DOMAIN=photos.example.com
        docker compose -f deploy/compose/caddy.compose.yml config --quiet
      - >-
        LUMILIO_STORAGE=/srv/lumilio/media
        LUMILIO_STATE=/srv/lumilio/state
        docker compose -f deploy/compose/acme.compose.yml config --quiet
      - docker compose -f deploy/compose/lumen-cpu.compose.yml config --quiet
      - docker compose -f deploy/compose/lumen-vulkan.compose.yml config --quiet
      - docker compose -f deploy/compose/lumen-cuda.compose.yml config --quiet
      - docker compose -f web/e2e/compose.yml -f web/e2e/compose.ci.yml config --quiet
      # Official Lumen Compose files are host-network only: mDNS discovery needs
      # the host LAN, so bridge mode, port mapping, and Host Broker are not
      # supported deployment paths. Assertions run on `docker compose config`
      # output, so they also catch future render-time drift.
      - cmd: "docker compose -f deploy/compose/lumen-cpu.compose.yml config | grep -q 'network_mode: host'"
        msg: lumen-cpu.compose.yml must use host networking
      - cmd: "docker compose -f deploy/compose/lumen-vulkan.compose.yml config | grep -q 'network_mode: host'"
        msg: lumen-vulkan.compose.yml must use host networking
      - cmd: "docker compose -f deploy/compose/lumen-vulkan.compose.yml config | grep -q 'source: /dev/dri'"
        msg: lumen-vulkan.compose.yml must map /dev/dri
      - cmd: "docker compose -f deploy/compose/lumen-cuda.compose.yml config | grep -q 'network_mode: host'"
        msg: lumen-cuda.compose.yml must use host networking
      - cmd: "docker compose -f deploy/compose/lumen-cuda.compose.yml config | grep -q 'count: -1'"
        msg: "lumen-cuda.compose.yml must declare gpus: all"

  assets:check:
    desc: Validate the committed assets.lock.json without network access
    cmds:
      - go -C server run ./tools/assetslock check "{{.ROOT_DIR}}"

  assets:verify:
    desc: Verify assets.lock.json against the pinned Lumilio-Assets release
    cmds:
      - go -C server run ./tools/assetslock verify "{{.ROOT_DIR}}"

  assets:reconcile:
    desc: >-
      Update assets.lock.json to the newest stable Lumilio-Assets release
      (or the explicit RELEASE), rejecting downgrades
    vars:
      RELEASE: '{{.RELEASE | default ""}}'
    cmds:
      - >-
        go -C server run ./tools/assetslock reconcile "{{.ROOT_DIR}}"
        {{if .RELEASE}}--release {{.RELEASE}}{{end}}

  lumen:check:
    desc: Validate committed Lumen lock, catalog, proto, and Compose intent offline
    cmds:
      - go -C server run ./tools/lumenlock check "{{.ROOT_DIR}}"

  lumen:verify:
    desc: Verify the committed Lumen pin against the producer release
    cmds:
      - go -C server run ./tools/lumenlock verify "{{.ROOT_DIR}}"

  lumen:sync:
    desc: >-
      Reconcile lumen.lock.json and regenerate the Desktop catalog from the
      pinned release or an explicit RELEASE
    vars:
      RELEASE: '{{.RELEASE | default ""}}'
    cmds:
      - >-
        go -C server run ./tools/lumenlock sync "{{.ROOT_DIR}}"
        {{if .RELEASE}}--release {{.RELEASE}}{{end}}

  dependencies:verify:
    desc: Verify both cross-repository pins against their producer repositories
    cmds:
      - task: lumen:verify
      - task: assets:verify

  config:examples:
    desc: Regenerate runtime configuration schema and examples
    cmds:
      - task: server:config-examples

  dev:config:
    desc: Initialize local development state and generate server.toml
    cmds:
      - go -C server run ./tools/devstate init "{{.ROOT_DIR}}"
      - task: server:config-init

  dev:clean:
    desc: Clean generated local development files
    cmds:
      - go -C server run ./tools/devstate clean "{{.ROOT_DIR}}"

  dev:reset:
    desc: Reset local development state
    cmds:
      - go -C server run ./tools/devstate reset "{{.ROOT_DIR}}"

  dev:purge:
    desc: Permanently remove local development state
    prompt: This permanently deletes local development state, including media. Continue?
    env:
      CONFIRM_DEV_PURGE: dev-purge
    cmds:
      - go -C server run ./tools/devstate purge "{{.ROOT_DIR}}"

  hooks:install:
    desc: Configure repository Git hooks
    if: git rev-parse --git-dir >/dev/null 2>&1
    cmds:
      - git config --local core.hooksPath .githooks

  tools:install:
    desc: Install the core development CLIs used by the default workflow
    cmds:
      - task: tools:swag

  wasm:setup:
    desc: Install the optional wasm-pack CLI for rebuilding browser WASM packages
    status:
      - command -v wasm-pack >/dev/null 2>&1
    cmds:
      - cargo install wasm-pack --locked

  tools:swag:
    internal: true
    status:
      - command -v swag >/dev/null 2>&1
    cmds:
      - go install github.com/swaggo/swag/v2/cmd/swag@v2.0.0-rc5

  # CI contracts. GitHub Actions provisions runners, native packages, caches,
  # credentials, and artifacts; these tasks own repository command semantics.
  ci:architecture:
    desc: Run architecture, Compose, and cross-repository catalog CI gates
    cmds:
      - task: architecture:check
      - task: compose:test
      - task: lumen:check
      - task: assets:check

  ci:server:
    desc: Run the standalone Server CI gate
    cmds:
      - task: server:test:ci

  ci:web:
    desc: Install and test the Web application in CI mode
    cmds:
      - task: ci:web:install
      - task: ci:web:test

  ci:web:install:
    desc: Install Web dependencies with the CI lockfile contract
    cmds:
      - task: web:install:ci

  ci:web:test:
    desc: Run the Web checks and unit tests with CI behavior
    cmds:
      - task: web:test

  ci:web:build:
    desc: Install and build the Web application in CI mode
    cmds:
      - task: ci:web:install
      - task: web:build

  ci:web:playwright:install:
    desc: Install the CI Playwright browser and system dependencies
    cmds:
      - task: web:playwright:install

  ci:web:playwright:install:deps:
    desc: Install CI Playwright system dependencies for a cached browser
    cmds:
      - task: web:playwright:install:deps

  ci:web:e2e:up:
    desc: Start the isolated CI E2E environment
    cmds:
      - task: web:e2e:up

  ci:web:e2e:down:
    desc: Stop the isolated CI E2E environment
    cmds:
      - task: web:e2e:down

  ci:web:e2e:browser:
    desc: Run the CI Chromium smoke regression
    cmds:
      - task: web:test:browser

  ci:web:e2e:auth-hardening:
    desc: Run the CI authentication hardening regression
    cmds:
      - task: web:test:auth-hardening

  ci:web:e2e:video-semantic:
    desc: Run the CI video semantic regression
    cmds:
      - task: web:test:video-semantic

  ci:web:e2e:backup-recovery:
    desc: Run the CI database backup and recovery regression
    cmds:
      - task: web:test:backup-recovery

  ci:site:
    desc: Install and build the documentation site in CI mode
    cmds:
      - task: site:install:ci
      - task: site:build

  ci:desktop:panel:
    desc: Install and build the Desktop control panel frontend
    cmds:
      - task: desktop:frontend:install:ci
      - task: desktop:frontend:build

  ci:desktop:native:
    desc: Test embedded Server and Desktop modules, then compile Desktop
    cmds:
      - task: server:test:ci
      - task: desktop:test:ci
      - task: desktop:compile
