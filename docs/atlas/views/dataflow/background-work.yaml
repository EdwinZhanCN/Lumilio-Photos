id: background-work
kind: dataflow
title: Background work — desired state to applied state
summary: >-
  Every asynchronous step is catalog-owned. A request writes desired state;
  the scheduler derives disposable River jobs from it; workers compute
  outside transactions under one resource governor; the commit coordinator
  alone writes the results and advances applied state. Losing QueueDB only
  delays work.
direction: LR
nodes:
  - id: requests
    label: Requests (upload, scan, retry, reindex)
    anchor: go:pipeline.RequestAssetStagesTx
    group: Catalog
    note: Write desired state in the same transaction as the product change.
  - id: receipts
    label: catalog_operation_receipts
    anchor: sql:catalog_operation_receipts
    shape: store
    group: Catalog
    note: Durable ingest, reindex, and other operation receipts the browser can follow.
  - id: state
    label: asset_pipeline_state
    anchor: sql:asset_pipeline_state
    shape: store
    group: Catalog
    note: desired_version vs applied_version per Asset and stage (analyze, derivatives, transcode, enrich).
  - id: scans
    label: repository_scans
    anchor: sql:repository_scans
    shape: store
    group: Catalog
    note: Pending scans and pending_hash entries drive repository work.
  - id: wake
    label: SchedulerWake
    anchor: go:queue.SchedulerWake
    note: Committed writes coalesce into one wake-up; the periodic pass is the recovery path.
  - id: scheduler
    label: Catalog scheduler
    anchor: go:queue.Scheduler.ScheduleOnce
    note: Bounded pass that derives work only from catalog state, never from River.
  - id: catalogjobs
    label: Macro job catalog
    anchor: go:jobs.RuntimeJobCatalog
    note: The closed set of job kinds; payloads carry identities and fences only.
  - id: river
    label: River on QueueDB
    anchor: go:queue.New
    shape: queue
    group: QueueDB
    note: Disposable delivery state with uniqueness over active deliveries.
  - id: workers
    label: Macro workers
    anchor: go:queue.AnalyzeAssetWorker
    group: Execution
  - id: governor
    label: Execution governor
    anchor: go:execution.Governor
    group: Execution
    note: Process-wide admission by QoS class (interactive, background, maintenance) against CPU, disk I/O, image and video codec, inference, and memory budgets.
  - id: processors
    label: Processors
    anchor: go:processors.AssetProcessor
    group: Execution
    note: Read/compute only; publish derived files, never catalog rows.
  - id: lumen
    label: Lumen Hub (optional ML)
    anchor: ext:Lumen Hub
    shape: external
    group: Execution
  - id: files
    label: Repository files and artifacts
    anchor: go:server/internal/storage.RepositoryFS
    shape: store
  - id: coordinator
    label: Commit coordinator
    anchor: go:commit.Coordinator
    note: Batches results into bounded writer transactions and checks fences.
edges:
  - from: requests
    to: state
    label: desired_version++
  - from: requests
    to: receipts
    label: pending receipt
  - from: state
    to: scheduler
    label: desired > applied
  - from: receipts
    to: scheduler
    label: pending ingest
  - from: scans
    to: scheduler
    label: due scans, pending hashes
  - from: wake
    to: scheduler
    style: dashed
    label: wake hint
  - from: scheduler
    to: catalogjobs
    label: typed args
  - from: catalogjobs
    to: river
    label: InsertMany (priority from QoS)
    anchor: go:queue.Scheduler.ScheduleOnce
  - from: river
    to: workers
    label: deliver
  - from: workers
    to: governor
    label: admit step
    anchor: go:execution.Engine.Run
  - from: governor
    to: processors
    label: run
  - from: processors
    to: files
    label: read originals, publish artifacts
  - from: processors
    to: lumen
    style: dashed
    label: embeddings, faces, OCR
  - from: processors
    to: coordinator
    label: immutable result + fence
    anchor: go:commit.Coordinator.ApplyAssetMetadata
  - from: coordinator
    to: state
    label: applied_version = desired (or stale)
  - from: coordinator
    to: receipts
    label: terminal
  - from: coordinator
    to: wake
    style: dashed
    label: notify
notes:
  - title: The invariant
    body: >-
      River never decides whether product work exists. If QueueDB is deleted,
      the next scheduler pass derives the same jobs from the catalog. If a
      delivery is retried, the coordinator's fence turns the second result
      into a stale or duplicate outcome.
  - title: No work inside write transactions
    body: >-
      Filesystem, media, network, and unbounded CPU work happen before the
      coordinator is called. Writer transactions only apply small, bounded,
      already-computed results.
related: [upload-to-catalog, asset-lifecycle]
