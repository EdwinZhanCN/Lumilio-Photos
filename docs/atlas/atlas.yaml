# Lumilio Atlas — the human-owned architecture declaration.
#
# Groups are the architecture vocabulary. Every Go package and Web module
# belongs to exactly one group: the one whose `match` paths contain it. `uses`
# is the complete, reviewed list of groups a group may import. The
# group-dependencies rule compares it with the import graph derived from
# source in BOTH directions: an import without a declaration fails, and a
# declaration that no import needs fails. `rules` are the other architecture
# rules, each proven by fixtures in server/tools/atlas/testdata/rules/<id>.
# Changing this file is an architecture decision — review it as one.
# Authoring guide: docs/atlas/README.md.

github: https://github.com/EdwinZhanCN/Lumilio-Photos
branch: dev

goModules:
  - { dir: server, path: server, side: server }
  - { dir: desktop, path: desktop, side: desktop }

# Handwritten documents whose references must resolve: repository paths in
# backticks, relative links, `task` targets, and /api/v1 routes. Decision
# records and postmortems are history and are not checked; active exec plans
# name work that does not exist yet.
docs:
  - AGENTS.md
  - CONTRIBUTING.md
  - docs/*.md
  - docs/atlas/README.md
  - docs/exec-plans/tech-debt-tracker.md
  - web/ARCHITECTURE.md
  - .agents/skills/*/SKILL.md

# Real routes deliberately left out of OpenAPI (inline infrastructure probes).
undocumentedRoutes:
  - /api/v1/health
  - /api/v1/health/live
  - /api/v1/health/ready

# Developer tooling and generated code are not part of the product map.
exclude:
  - server/tools/**
  - server/docs
  - desktop/cmd/**
  - desktop/internal/resources/cmd/**
  - server/internal/db/sqlitespike/sqlcfixture/**

groups:
  # ---------------------------------------------------------------- Server
  - id: foundation
    title: Foundation
    side: server
    match:
      - server/config
      - server/internal/db/dbtypes
      - server/internal/logging
      - server/internal/secretbox
      - server/internal/settings
      - server/internal/testutil
      - server/internal/utils/memory
      - server/internal/utils/sysproc
      - server/internal/version
      - server/internal/workqos
      - server/platform/fsprivacy
      - server/platform/sqliteuri
    summary: >-
      Dependency-free primitives every layer may use: the strict TOML
      configuration loader, runtime-mutable settings types, logging, version,
      work QoS classes, catalog value types, secret sealing, and OS/SQLite
      platform helpers. Nothing here knows about Assets, repositories, or HTTP.

  - id: media
    title: Media utilities
    side: server
    match:
      - server/internal/utils/exif
      - server/internal/utils/file
      - server/internal/utils/geohash
      - server/internal/utils/hash
      - server/internal/utils/imagesource
      - server/internal/utils/imaging
      - server/internal/utils/phash
      - server/internal/utils/raw
    uses: [foundation]
    summary: >-
      Stateless file and media mechanics: content hashing, EXIF extraction,
      libvips imaging, LibRaw decoding, perceptual hashes, geohash, and
      process helpers. Pure functions over bytes and paths; no catalog access.

  - id: catalog
    title: Catalog
    side: server
    match:
      - server/internal/db
      - server/internal/db/backup
      - server/internal/db/catalogtx
      - server/internal/db/repo
      - server/internal/db/sqlitespike
      - server/internal/db/vec1ext
      - server/internal/db/vectorindex
      - server/migrations
    uses: [foundation, media]
    summary: >-
      The embedded SQLite catalog and its QueueDB sibling: the single-writer
      runtime, named transactions, sqlc queries, the Vec1 vector index,
      migrations, and verified backups. The catalog is product truth.

  - id: work
    title: Work contracts
    side: server
    match:
      - server/internal/execution
      - server/internal/pipeline
      - server/internal/processing
      - server/internal/queue/jobs
    uses: [foundation, catalog]
    summary: >-
      Catalog-owned asynchronous work vocabulary: desired/applied pipeline
      contracts, the closed River macro-job catalog, the process-wide execution
      governor, and the administrator processing read model.

  - id: domain
    title: Domain semantics
    side: server
    match:
      - server/internal/classify
      - server/internal/event
      - server/internal/lifecycle
      - server/internal/llm
      - server/internal/search
      - server/internal/search/bleveocr
    uses: [foundation, catalog, work]
    summary: >-
      Derived product meaning that is independent of storage and transport:
      Event topology, the Asset lifecycle rules, search (FTS5, vectors, OCR
      sidecar), zero-shot classification math, and the LLM provider adapter.

  - id: storage
    title: Storage
    side: server
    match:
      - server/internal/artifact
      - server/internal/storage
      - server/internal/storage/locations
      - server/internal/storage/marker
      - server/internal/storage/pathsemantics
      - server/internal/storage/recovery
      - server/internal/storage/repocfg
      - server/internal/storage/rootcfg
      - server/internal/storage/scan
      - server/internal/storage/testfixture
      - server/internal/storage/trash
    uses: [foundation, media, catalog, domain]
    summary: >-
      Storage Locations and Repositories on disk: repository lifecycle and
      layout, the scan index that mirrors each repository tree in
      repository_entries, the journaled repository trash, and immutable
      derived artifacts.

  - id: agent
    title: Lumilio Agent
    side: server
    match:
      - server/internal/agent/core
      - server/internal/agent/facets
      - server/internal/agent/inject
      - server/internal/agent/pins
      - server/internal/agent/ref
      - server/internal/agent/tools
    uses: [foundation, media, catalog, domain]
    summary: >-
      The in-app assistant: the agent run loop, typed references and facets,
      pinned widgets, prompt injection of library context, and the tools the
      model may call over the catalog.

  - id: service
    title: Services
    side: server
    match:
      - server/internal/service
    uses: [foundation, media, catalog, work, domain, storage, agent]
    summary: >-
      Business logic behind the HTTP API: authentication and MFA, assets,
      albums, people, music, settings, setup, search orchestration, cloud
      import planning, and ML adapters.

  - id: ingest
    title: Ingest and execution
    side: server
    match:
      - server/internal/cloud
      - server/internal/cloud/icloud
      - server/internal/commit
      - server/internal/processors
      - server/internal/queue
      - server/internal/sourcing
      - server/internal/utils/upload
    uses: [foundation, media, catalog, work, domain, storage, service]
    summary: >-
      Everything that moves bytes and background results into the catalog:
      staged sourcing for upload and cloud import, the River workers and
      scheduler, media processors, and the commit coordinator that is the only
      writer of asynchronous results.

  - id: http
    title: HTTP API
    side: server
    match:
      - server/internal/api
      - server/internal/api/dto
      - server/internal/api/handler
      - server/internal/api/problem
      - server/internal/api/ratelimit
      - server/internal/httporigin
      - server/internal/servertransport
    uses: [foundation, media, catalog, work, domain, storage, agent, service, ingest]
    summary: >-
      The transport edge: router and auth boundaries, handlers, DTOs, RFC 9457
      Problem responses, rate limiting, request-origin policy, and the
      plaintext/ACME listeners.

  - id: runtime
    title: Server runtime
    side: server
    match:
      - server
      - server/app
      - server/cmd
    uses: [foundation, media, catalog, work, domain, storage, agent, service, ingest, http]
    summary: >-
      Process composition: the CLI entry point, the Docker entrypoint, and
      server/app, the only place that wires every subsystem together and owns
      startup and graceful shutdown. Desktop hosts the same runtime in-process.

  # --------------------------------------------------------------- Desktop
  - id: desktop-platform
    title: Desktop platform
    side: desktop
    match:
      - desktop/internal/buildinfo
      - desktop/internal/platform
      - desktop/internal/platform/stateversion
      - desktop/internal/resources
    summary: >-
      OS integration for the Desktop App: application-support paths, schema
      versions for desktop state files, signed resource manifests, and build
      metadata.

  - id: desktop-control
    title: Desktop control plane
    side: desktop
    match:
      - desktop/internal/control
      - desktop/internal/control/dto
      - desktop/internal/operation
      - desktop/internal/state
    summary: >-
      The revisioned snapshot the Settings window and the tray render, its
      DTOs, the validating service facade they call, and the request-id
      idempotent operation gate that serializes every mutation.

  - id: desktop-runtime
    title: Desktop runtime
    side: desktop
    match:
      - desktop/internal/preferences
      - desktop/internal/runtime
      - desktop/internal/runtime/runtimeconfig
      - desktop/internal/shutdown
      - desktop/internal/storage
    uses: [desktop-platform, desktop-control, foundation, runtime]
    summary: >-
      Hosts server/app in-process: the runtime generation supervisor, the
      schema-versioned runtime configuration transaction, preferences, the
      repository handoff, and coordinated shutdown.

  - id: desktop-services
    title: Desktop services
    side: desktop
    match:
      - desktop/internal/lumen
      - desktop/internal/lumen/controlv1
      - desktop/internal/update
    uses: [desktop-platform, desktop-control]
    summary: >-
      Optional supervised capabilities: the Lumen ML child process with signed
      staged artifacts, and the application update aggregate, whose transport
      and signature verification the host supplies.

  - id: desktop-panel
    title: Desktop panel
    side: desktop
    match:
      - desktop/internal/locales
      - desktop/internal/panel
    uses: [desktop-control]
    summary: >-
      The Settings window as native UI drawn by MyGo: its view state, the
      draft that is the one save boundary, operation tracking, and the message
      catalogs every string a person reads comes from. It calls the control
      plane through the validating service facade and never a controller.

  - id: desktop-host
    title: Desktop host
    side: desktop
    match:
      - desktop
      - desktop/internal/host
    uses: [desktop-platform, desktop-control, desktop-runtime, desktop-services, desktop-panel]
    summary: >-
      The MyGo tray application: the main assembly, the tray menu, the
      on-demand Settings window, the navigation guard, the coordinated quit,
      and the adapter that gives the update controller MyGo's signed updater.
      The product UI stays in the system browser.

  # ------------------------------------------------------------------- Web
  - id: web-lib
    title: Web lib
    side: web
    match: [web/src/lib, web/src/lib/**, web/src/config]
    summary: >-
      Non-visual lower layer: the generated OpenAPI client, i18n, preferences,
      theme, formatting, geo, and small cross-feature contracts. Never imports
      a feature.

  - id: web-workers
    title: Web workers
    side: web
    match: [web/src/workers]
    uses: [web-lib]
    summary: >-
      Browser worker entry points (hashing, justified layout, Studio tools)
      and the shared worker client.

  - id: web-components
    title: Web components
    side: web
    match: [web/src/components/**]
    uses: [web-lib]
    summary: >-
      Reusable presentational UI with no feature, API, or store dependency.

  - id: web-contexts
    title: Web contexts
    side: web
    match: [web/src/contexts]
    uses: [web-lib, web-workers]
    summary: >-
      Truly application-wide React providers: global notifications and worker
      access.

  - id: web-features
    title: Web features
    side: web
    match: [web/src/features/**]
    uses: [web-lib, web-workers, web-components, web-contexts]
    summary: >-
      Product capabilities. Each feature owns its routes, flows, model, API
      adapters, and state, and documents itself in doc.ts. Features import each
      other only through narrow public entries, acyclically.

  - id: web-app
    title: Web app shell
    side: web
    match: [web/src/main.tsx, web/src/app]
    uses: [web-lib, web-components, web-contexts, web-features]
    summary: >-
      Composition root: providers, router, shell, and fatal-error handling. No
      domain behaviour.

# Architecture rules over type-resolved facts. Each names the invariant it
# protects in `why`; violations that existed when a rule landed are baselined
# by symbol in atlas.lock.json and may only shrink.
rules:
  - id: group-dependencies
    why: every import that crosses a group boundary is a reviewed architecture decision
    group_uses: true

  # ------------------------------------------------------ catalog writer
  - id: catalog-transactions
    why: one writer; every catalog transaction is named, admitted, and measured by catalogtx
    calls:
      targets:
        - (*database/sql.DB).Begin
        - (*database/sql.DB).BeginTx
        - (*database/sql.Conn).BeginTx
        - (*database/sql.DB).Exec
        - (*database/sql.DB).ExecContext
      # sqlitespike is the SQLite conformance harness; it opens its own
      # throwaway databases.
      only: [server/internal/db/catalogtx, server/internal/db, server/internal/db/sqlitespike]

  - id: tx-purity
    why: no filesystem, network, hashing, sleeping, or table-wide COUNT inside a transaction, which holds the single writer or a read snapshot
    tx_purity:
      tx_types: ["*database/sql.Tx", "*server/internal/db/catalogtx.Tx"]
      begin: [(*server/internal/db/catalogtx.Writer).BeginTx]
      forbid_packages: [os, io, io/fs, io/ioutil, net, net/http, server/internal/utils/hash, github.com/zeebo/blake3]
      forbid_calls:
        - time.Sleep
        - time.After
        - time.Tick
        - time.NewTimer
        - time.NewTicker
        - path/filepath.Walk
        - path/filepath.WalkDir
        - path/filepath.Glob
      forbid_count_queries: true
      allow:
        # Pure helpers of a forbidden package.
        - os.IsNotExist
        - os.IsExist
        - os.IsPermission
        - io/fs.ValidPath
        # Bounded by a unique key: one trash ID per trashed file.
        - (*server/internal/db/repo.Queries).CountRepositoryEntriesWithTrashID
        # Bounded by its key set: the media items of one Live Photo pair.
        - (*server/internal/db/repo.Queries).CountStackedMediaItems

  - id: static-sql
    why: every SQL statement is a constant or a sqlc query, so the table rules see every read and write
    static_sql: true

  - id: asset-purge
    why: an Asset disappears only through the lifecycle purge, which removes its entries first
    tables:
      assets: { delete: [server/internal/lifecycle] }

  - id: river-tables
    why: River's tables are the queue's private state; product correctness never consults them
    tables:
      river_job:
        read:
          - server/internal/queue
          - server/internal/queue/jobs
          - server/internal/api/handler/queue_handler.go
          - server/app/sqlite_diagnostics.go
        write: [server/internal/queue]

  # ------------------------------------------------------ asynchronous work
  - id: producer-capabilities
    why: asynchronous preparers own only narrow read and compute interfaces; catalog mutation belongs to the commit coordinator
    forbid_types:
      in:
        - server/internal/sourcing/materializer.go
        - server/internal/storage/locations/resolver.go
        - server/internal/processors/asset_processor.go
        - server/internal/queue/asset_work_fence.go
        - server/internal/queue/enrichment_runner.go
        - server/internal/queue/ml_image_loader.go
        - server/internal/queue/projection_preparer.go
      types:
        - "*database/sql.DB"
        - "*server/internal/db/repo.Queries"
        - server/internal/service.SettingsService
        - server/internal/service.LumenService
        - server/internal/service.ClassifierService
        - server/internal/service.LocationService
        - server/internal/service.AssetIndexingService

  - id: catalog-handle-imports
    why: preparers and the scan index never hold the catalog database; they write through the commit coordinator
    forbid_imports:
      from:
        - server/internal/sourcing/materializer.go
        - server/internal/storage/locations/resolver.go
        - server/internal/processors/asset_processor.go
        - server/internal/queue/asset_work_fence.go
        - server/internal/queue/enrichment_runner.go
        - server/internal/queue/ml_image_loader.go
        - server/internal/queue/projection_preparer.go
        - server/internal/storage/scan
      imports: [server/internal/db]

  - id: scan-index-query-set
    why: the scan index writes only through its Writer; it never builds its own catalog query set
    calls:
      targets: [server/internal/db/repo.New]
      forbid: [server/internal/storage/scan]

  - id: river-child-jobs
    why: workers never enqueue child work; the catalog-derived scheduler is the only River producer
    calls:
      targets:
        - (*github.com/riverqueue/river.Client).Insert
        - (*github.com/riverqueue/river.Client).InsertTx
        - (*github.com/riverqueue/river.Client).InsertMany
        - (*github.com/riverqueue/river.Client).InsertManyTx
        - (*github.com/riverqueue/river.Client).InsertManyFast
        - (*github.com/riverqueue/river.Client).InsertManyFastTx
      only: [server/internal/queue/scheduler.go]

  - id: execution-governor
    why: one process-wide execution governor, built by the execution package from the budget
    calls:
      targets: [server/internal/execution.NewGovernor]
      only: [server/internal/execution]

  - id: execution-resources
    why: resource demands come from the execution package's demand table, never from literals scattered through the pipeline
    constructs:
      types: [server/internal/execution.Resources]
      only: [server/internal/execution]

  - id: scheduling-algorithms
    why: the composition root only constructs and runs; macro work runs in the pipeline runtime and the ingest packages
    calls:
      targets:
        - (*server/internal/processors.AssetProcessor).ComputeMetadataTask
        - (*server/internal/processors.AssetProcessor).LoadThumbnailTask
        - (*server/internal/processors.AssetProcessor).ComputeThumbnailCodec
        - (*server/internal/processors.AssetProcessor).ComputeThumbnailScale
        - (*server/internal/processors.AssetProcessor).LoadTranscodeTask
        - (*server/internal/processors.AssetProcessor).ComputeTranscodeTask
        - (*server/internal/processors.AssetProcessor).ProcessVideoFramesTask
        - server/app.runAssetEnrichment
        - (*server/app.pipelineRuntime).prepareProjection
        - github.com/riverqueue/river.AddWorker
      only:
        - server/internal/cloud/**
        - server/internal/commit
        - server/internal/processors
        - server/internal/queue/**
        - server/internal/sourcing
        - server/internal/utils/upload
        - server/app/pipeline_runtime.go

  # ------------------------------------------------------ storage
  - id: storage-reconciliation
    why: projection writes run at startup and in the background reconciler; a foreground read never reconciles
    calls:
      targets:
        - (*server/internal/storage.DefaultRepositoryManager).ReconcileAll
        - (*server/internal/storage.DefaultRepositoryManager).ReconcileStorageLocations
      only: [server/app, server/internal/storage]

  # ------------------------------------------------------ desktop
  - id: desktop-marker-parsing
    why: the Desktop asks server/app about portable markers; the Server's typed readers are the only marker parsers
    forbid_imports:
      from: [desktop/**]
      imports: [gopkg.in/yaml.v2, gopkg.in/yaml.v3, github.com/goccy/go-yaml]

  # ------------------------------------------------------ size
  - id: package-size
    why: a package stays small enough to read and review whole; packages over the default only shrink
    budgets: { default: 5000 }

# Where SQL comes from for the static-sql and tables rules.
sql:
  queries:
    - files: [server/internal/db/repo/queries/*.sql]
      type: "*server/internal/db/repo.Queries"
  executors:
    - "*database/sql.DB"
    - "*database/sql.Tx"
    - "*database/sql.Conn"
    - "*server/internal/db/catalogtx.Tx"
    - "*server/internal/db/catalogtx.Writer"
    - "*server/internal/db/catalogtx.Reader"
    - "*server/internal/db.queryRouter"
  triggers: [server/migrations/*.up.sql]

exceptions:
  - from: server/internal/db/repo
    to: server/internal/storage/repocfg
    reason: >-
      sqlc maps the repositories.config column to repocfg.RepositoryConfig so
      the catalog stores a typed per-repository configuration. repocfg is
      dependency-free, so this cannot create a cycle.
  - from: server/internal/db/repo
    to: server/internal/storage/pathsemantics
    reason: >-
      sqlc maps repositories.path_case and path_normalization to the
      pathsemantics CaseMode and Normalization types so the catalog stores the
      measured volume name rule the scan index keys under, never a free
      string. pathsemantics depends only on the standard library and
      x/text, so this cannot create a cycle.
