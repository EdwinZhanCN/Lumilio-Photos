schema_version = 3
environment = "test"

[database]
path = "/data/app-state/library.sqlite3"

[server]
listen = "0.0.0.0:6680"
primary_origin = "http://localhost:16657"
cors_allowed_origins = []
web_root = "/app/web"

[server.tls]
mode = "off"
http_listen = ""
email = ""
storage_path = ""

[server.proxy]
mode = "disabled"
trusted_cidrs = []

[logging]
level = "info"
dir = "/data/app-state/logs"
console_format = "console"
file_format = "json"
repository_audit_verbose = false

[storage]
path = "/data/storage"
cloud_state_path = "/data/app-state/cloud"
backups_path = "/data/app-state/backups"

[repository_scan]
enabled = true
interval_seconds = 3600
settle_seconds = 1
max_concurrent_repos = 1
batch_size = 50

[geocoding]
provider = "disabled"
nominatim_endpoint = "https://nominatim.openstreetmap.org/reverse"
language = "en"
user_agent = "Lumilio-Photos-E2E/1.0"

[auth]
secret_key_file = "/data/app-state/secrets/lumilio_secret_key"
access_token_ttl = "15m"
refresh_token_ttl = "1h"
media_token_ttl = "10m"

[auth.passkey]
enabled = true
name = "Lumilio Photos E2E"

[auth.rate_limit]
ip_attempts = 1000
subject_attempts = 3
window = "1s"
lockout = "2s"
max_entries = 10000

[transcode]
hardware_accel = "none"

[lumen]
discovery_enabled = true
discovery_mdns_enabled = false
discovery_hub_url = ""
discovery_static_nodes = ["lumen-fixture:50051"]
discovery_service_type = "_lumen._tcp"
discovery_domain = "local"
deployment_id = "e2e"
resolve_timeout = "1s"
connect_timeout = "5s"
rediscovery_backoff_min = "1s"
rediscovery_backoff_max = "5s"
scan_interval = "30s"
chunk_auto = true
chunk_threshold_bytes = 1048576
chunk_max_bytes = 262144

[tools]
exiftool_path = "exiftool"
ffmpeg_path = "ffmpeg"
ffprobe_path = "ffprobe"
