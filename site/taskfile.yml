# Documentation site (VitePress) tasks. Runs in the site/ directory.
version: '3'

tasks:
  install:
    desc: Install documentation site dependencies
    env:
      CI: '1'
      VITE_GIT_HOOKS: '0'
    cmds:
      - vp install

  install:ci:
    desc: Install documentation site dependencies in CI mode with a frozen lockfile
    env:
      CI: '1'
      VITE_GIT_HOOKS: '0'
    cmds:
      - vp install --frozen-lockfile

  checks:
    desc: Run documentation site CI checks (bilingual parity, naming, links, presets)
    cmds:
      - node scripts/docs-checks.ts

  dev:
    desc: Start the VitePress development server
    cmds:
      - vp run dev

  atlas:
    desc: Serve the internal Atlas page (use the root `task atlas`, which writes its data first)
    env:
      LUMILIO_ATLAS: '1'
    cmds:
      - vp exec vitepress dev docs --strictPort --open /atlas/

  build:atlas:
    desc: Compile the internal Atlas variant (no deploy) so its Vue code cannot rot unseen
    env:
      LUMILIO_ATLAS: '1'
    cmds:
      - vp exec vitepress build docs --outDir ../.local/atlas/build
      - rm -rf ../.local/atlas/build

  build:
    desc: Build the documentation site
    cmds:
      - vp run build

  preview:
    desc: Preview the built documentation site
    cmds:
      - vp run preview

  openapi-docs:
    desc: Regenerate the Redoc API documentation from the server spec
    cmds:
      - ./node_modules/.bin/redocly build-docs ../server/docs/swagger.yaml --output docs/public/redoc-static.html

  media:manifest:
    desc: Generate the media manifest
    cmds:
      - node scripts/media.ts manifest

  media:sync:
    desc: Sync versioned site media
    cmds:
      - node scripts/media.ts sync

  media:verify:
    desc: Verify site media integrity
    cmds:
      - node scripts/media.ts verify
